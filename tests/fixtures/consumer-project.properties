# Sanitized full-scope consumer baseline, not a user-specific installation.
sonar.projectKey=example-project
sonar.projectName=Example Project
sonar.projectVersion=0.1.0
sonar.sources=App,Shared,Sources,Widgets,MacMenuBar,MacApp,NotificationService,PushProvider,Tools,Scripts
sonar.tests=AppTests,MacAppTests,Tests,UITests,Tools,Scripts/tests
sonar.test.inclusions=AppTests/**/*.swift,MacAppTests/**/*.swift,Tests/**/*.swift,UITests/**/*.swift,Tools/test_*.py,Scripts/tests/test_*.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
sonar.exclusions=**/.build/**,**/build/**,**/DerivedData/**,docs/**,**/*.generated.swift
